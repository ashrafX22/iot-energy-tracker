name: iot-energy-tracker

services:
  # =============================================================
  # Database Service for user-service (Database-per-Service)
  # =============================================================
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USER:-user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-password}
    ports:
      # Exposes container port 5432 on the host
      - "${USER_DB_PORT:-5433}:5432"
    volumes:
      # Persists database data across container restarts
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-user} -d ${USER_DB_NAME:-user_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - energy-tracker-network

  # =============================================================
  # TimescaleDB Time-Series Database Service
  # =============================================================
  timescale-db:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALE_DB_NAME:-timescale_db}
      POSTGRES_USER: ${TIMESCALE_DB_USER:-user}
      POSTGRES_PASSWORD: ${TIMESCALE_DB_PASSWORD:-password}
    ports:
      # Exposes container port 5432 on the host
      - "${TIMESCALE_DB_PORT:-5434}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_DB_USER:-user} -d ${TIMESCALE_DB_NAME:-timescale_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - energy-tracker-network

  # =============================================================
  # User Service Microservice Application Container
  # =============================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    container_name: user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      # Inside Docker, hostname is the service name 'user-db' on internal port 5432
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: ${USER_DB_NAME:-user_db}
      DB_USER: ${USER_DB_USER:-user}
      DB_PASSWORD: ${USER_DB_PASSWORD:-password}
    volumes:
      # Mount the local project directory for live class & source syncing
      - ./user-service:/app
      # Cache downloaded Maven dependencies
      - ./.docker-cache/maven:/root/.m2
    develop:
      watch:
        - action: sync
          path: ./user-service/src
          target: /app/src
        - action: sync
          path: ./user-service/target/classes
          target: /app/target/classes
        - action: rebuild
          path: ./user-service/pom.xml
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - energy-tracker-network

  # =============================================================
  # Device Service Microservice Application Container
  # =============================================================
  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile.dev
    container_name: device-service
    restart: unless-stopped
    ports:
      - "${DEVICE_SERVICE_PORT:-8082}:8082"
    environment:
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: ${USER_DB_NAME:-user_db}
      DB_USER: ${USER_DB_USER:-user}
      DB_PASSWORD: ${USER_DB_PASSWORD:-password}
    volumes:
      - ./device-service:/app
      - ./.docker-cache/maven:/root/.m2
    develop:
      watch:
        - action: sync
          path: ./device-service/src
          target: /app/src
        - action: sync
          path: ./device-service/target/classes
          target: /app/target/classes
        - action: rebuild
          path: ./device-service/pom.xml
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - energy-tracker-network

  # =============================================================
  # Ingestion Service Microservice Application Container
  # =============================================================
  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile.dev
    container_name: ingestion-service
    restart: unless-stopped
    ports:
      - "${INGESTION_SERVICE_PORT:-8083}:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./ingestion-service:/app
      - ./.docker-cache/maven:/root/.m2
    develop:
      watch:
        - action: sync
          path: ./ingestion-service/src
          target: /app/src
        - action: sync
          path: ./ingestion-service/target/classes
          target: /app/target/classes
        - action: rebuild
          path: ./ingestion-service/pom.xml
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - energy-tracker-network

  # =============================================================
  # Usage Service Microservice Application Container
  # =============================================================
  usage-service:
    build:
      context: ./usage-service
      dockerfile: Dockerfile.dev
    container_name: usage-service
    restart: unless-stopped
    ports:
      - "${USAGE_SERVICE_PORT:-8084}:8084"
    environment:
      DB_URL: jdbc:postgresql://timescale-db:5432/${TIMESCALE_DB_NAME:-timescale_db}
      DB_USER: ${TIMESCALE_DB_USER:-user}
      DB_PASSWORD: ${TIMESCALE_DB_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENERGY_TOPIC: ${KAFKA_ENERGY_TOPIC:-energy-usage-events}
    volumes:
      - ./usage-service:/app
      - ./.docker-cache/maven:/root/.m2
    develop:
      watch:
        - action: sync
          path: ./usage-service/src
          target: /app/src
        - action: sync
          path: ./usage-service/target/classes
          target: /app/target/classes
        - action: rebuild
          path: ./usage-service/pom.xml
    depends_on:
      timescale-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - energy-tracker-network

  # =============================================================
  # Apache Kafka (KRaft Mode - No ZooKeeper)
  # =============================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      # 9092 for internal network / container access, 9094 for host access
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - energy-tracker-network

  # =============================================================
  # IoT Device Simulator (Activated via --profile simulator)
  # =============================================================
  iot-simulator:
    build:
      context: iot-simulator-service
      dockerfile: Dockerfile
    container_name: iot-simulator
    restart: unless-stopped
    profiles:
      - simulator
    environment:
      INGESTION_URL: http://ingestion-service:8083/ingestion/energy
      DEVICE_SERVICE_URL: http://device-service:8082/devices
      SIM_NUM_DEVICES: "10"
      SIM_INTERVAL: "3.0"
    depends_on:
      ingestion-service:
        condition: service_started
    networks:
      - energy-tracker-network

volumes:
  user_db_data:
    driver: local
  timescale_data:
    driver: local
  kafka_data:
    driver: local

networks:
  energy-tracker-network:
    driver: bridge
