server:
  port: 8081

spring:
  application:
    name: user-service

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

  datasource:
    # 12-Factor App config: defaults to localhost:5433 for local host execution,
    # and gets overridden by DB_HOST / DB_PORT in Docker Compose or Kubernetes
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:user_db}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: UserHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      # In microservices, Flyway manages schema migrations; Hibernate only validates
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
